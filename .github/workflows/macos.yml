name: macOS build and core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build native app and bundled LAME
        run: ./scripts/build-app.sh
      - name: Run core checks
        run: swift run --build-system native CoreChecks
      - name: Verify local signatures
        run: codesign --verify --deep --strict dist/*.app
